- id: UC-102
  title: Find Jay Chou latest album in QQ Music
  target:
    kind: app
    id: com.tencent.QQMusicMac
    name: QQ音乐
    platform: macos
  requires:
    platform: macos
    permissions:
      - accessibility
      - screenRecording
  steps:
    - open app
    - read app state
    - type 周杰伦 into search input
    - press key Enter in search input wait for state change timeout 5s
    - wait for search results to load
    - click tab named 专辑
    - wait for album results to load
    - extract latest Jay Chou album from visible album results; only accept entries where artist is 周杰伦, compare release dates, and return albumName releaseDate artist
  success:
    - QQ音乐 is the target app
    - search query submitted
    - album tab loaded
    - latest Jay Chou album name artist and release date extracted successfully

